[project]
name = "clew"
version = "0.1.0"
description = "ARIADNE: subquadratic trifecta attention, from scratch"
readme = "README.md"
authors = [
    { name = "Vamshi Krishna Kodimala", email = "vkrishnakodimala@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy",
    "matplotlib",
    "tqdm",
    "requests",
]

[project.scripts]
clew = "clew.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clew"]
